# TG Matrix：tag 触发 macOS (dmg) + Windows (NSIS) 构建并上传 GitHub Release
#
# 用法：
#   git tag v0.1.0 && git push origin v0.1.0
#   或 Actions → Release → Run workflow，填已有 tag
#
# 首版不做 Apple 公证 / Windows 代码签名（未签名包见下方安装说明）。

name: Release

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的已有 tag（如 v0.1.0）；构建该 tag 指向的提交"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org
  TG_RELEASE_SKIP_SIGN: "1"
  CI: "true"

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: services/sidecar/go.sum

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Install NSIS (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $nsis = "${env:ProgramFiles(x86)}\NSIS"
          if (Test-Path "$nsis\makensis.exe") {
            echo "$nsis" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Release build (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/release.sh scripts/build.sh
          TG_RELEASE_SKIP_SIGN=1 ./scripts/release.sh

      - name: Release build (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\release.ps1

      - name: Collect installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-release
          # release 脚本产物：dist/release/vX.Y.Z/
          shopt -s nullglob
          found=0
          for dir in dist/release/v*; do
            [[ -d "$dir" ]] || continue
            if [[ "${{ matrix.platform }}" == "macos" ]]; then
              cp -f "$dir"/*.dmg dist-release/ 2>/dev/null || true
            else
              cp -f "$dir"/*.exe dist-release/ 2>/dev/null || true
              cp -f "$dir"/*.msi dist-release/ 2>/dev/null || true
            fi
            cp -f "$dir"/checksums.sha256 dist-release/checksums-${{ matrix.platform }}.sha256 2>/dev/null || true
            found=1
          done
          # 兜底：直接从 Tauri bundle 捞
          BUNDLE="apps/desktop/src-tauri/target/release/bundle"
          if [[ "${{ matrix.platform }}" == "macos" ]]; then
            cp -f "$BUNDLE"/dmg/*.dmg dist-release/ 2>/dev/null || true
          else
            cp -f "$BUNDLE"/nsis/*.exe dist-release/ 2>/dev/null || true
            cp -f "$BUNDLE"/msi/*.msi dist-release/ 2>/dev/null || true
          fi
          echo "=== dist-release ==="
          ls -lah dist-release || true
          count="$(find dist-release -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \) | wc -l | tr -d ' ')"
          if [[ "$count" -lt 1 ]]; then
            echo "未收集到安装包" >&2
            find apps/desktop/src-tauri/target -name '*.dmg' -o -name '*.exe' -o -name '*.msi' 2>/dev/null | head -40 || true
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tg-matrix-${{ matrix.platform }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          echo "=== release-assets ==="
          find release-assets -type f -print
          cd release-assets
          # 合并各平台 checksum；再生成总表
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum *.dmg *.exe *.msi 2>/dev/null > SHA256SUMS.txt || true
          else
            shasum -a 256 *.dmg *.exe *.msi 2>/dev/null > SHA256SUMS.txt || true
          fi
          cat SHA256SUMS.txt || true

      - name: Resolve tag name
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: TG Matrix ${{ steps.tag.outputs.name }}
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.name, '-') }}
          generate_release_notes: true
          body: |
            ## 安装说明

            - **macOS**：下载 `.dmg`。未签名时若 Gatekeeper 拦截，请对 App **右键 → 打开**。
            - **Windows**：下载 NSIS 安装包（`.exe`）。未签名时可能触发 SmartScreen，选择仍要运行即可。
            - 数据与协议号会话仅保存在本机；无需注册登录。
            - 校验：对照附件 `SHA256SUMS.txt`。

            ## 本地发版

            ```bash
            # macOS
            TG_RELEASE_SKIP_SIGN=1 ./scripts/release.sh 0.1.0

            # Windows（本机）
            scripts\release-win.cmd 0.1.0
            ```
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
